name: Deploy FeenQR to EC2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ec2_host:
        description: 'EC2 hostname (leave blank to use the default)'
        required: false
        type: string

env:
  DOTNET_VERSION: '9.0'
  PROJECT_PATH: 'WebApp/Server/Server.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build and publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c Release \
            -o publish \
            /p:UseAppHost=false

      - name: Determine EC2 host
        id: ec2
        run: |
          HOST="${{ github.event.inputs.ec2_host || secrets.EC2_HOST }}"
          if [ -z "$HOST" ]; then
            echo "ERROR: No EC2_HOST provided. Set it as a GitHub secret named EC2_HOST."
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail
            REMOTE_DIR="/home/${{ secrets.SSH_USER || 'ubuntu' }}/codechest/FeenQR"
            DOMAIN="${{ secrets.DOMAIN || 'feenqr.misango.me' }}"
            echo "=== Deploying FeenQR ==="
            echo "Remote dir: $REMOTE_DIR | Domain: $DOMAIN"
            mkdir -p "$REMOTE_DIR/publish" "$REMOTE_DIR/logs" "$REMOTE_DIR/uploads"
            mkdir -p "$REMOTE_DIR/Scripts"

      - name: Sync build artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "publish/,Caddyfile,docker-compose.yml,Dockerfile,Dockerfile.webapp,appsettings.json,Scripts/"
          target: "/home/${{ secrets.SSH_USER || 'ubuntu' }}/codechest/FeenQR/"
          strip_components: 0

      - name: Build & restart app (Caddy stays running — no SSL refresh)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            REMOTE_DIR="/home/${{ secrets.SSH_USER || 'ubuntu' }}/codechest/FeenQR"
            DOMAIN="${{ secrets.DOMAIN || 'feenqr.misango.me' }}"
            SHARED_CADDY="achest-caddy"
            SHARED_CADDY_NETWORK="shared-trading-net"
            SHARED_CADDYFILE="/home/${{ secrets.SSH_USER || 'ubuntu' }}/codechest/Arithmax_Chest/Caddyfile"
            cd "$REMOTE_DIR"

            echo "=== 1. Build feenqr-web image ==="
            docker compose build feenqr-web

            echo "=== 2. Ensure Qdrant is running ==="
            if ! docker ps --format '{{.Names}}' | grep -q '^qdrant$'; then
              docker compose up -d qdrant
              for i in $(seq 1 30); do
                if docker exec qdrant bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e "GET /healthz HTTP/1.1\r\nhost: localhost\r\nconnection: close\r\n\r\n" >&3 && head -1 <&3' 2>/dev/null | grep -q 200; then
                  echo "Qdrant ready"; break
                fi
                sleep 2
              done
            else
              echo "Qdrant already running"
            fi

            echo "=== 3. Restart feenqr-web (Caddy untouched) ==="
            docker compose up -d --force-recreate feenqr-web

            echo "=== 4. Register with shared Caddy ==="
            if docker ps --format '{{.Names}}' | grep -q "^$SHARED_CADDY$"; then
              docker network connect "$SHARED_CADDY_NETWORK" feenqr-web 2>/dev/null || true
              if [ -f "$SHARED_CADDYFILE" ]; then
                if ! grep -q "$DOMAIN" "$SHARED_CADDYFILE"; then
                  echo "" >> "$SHARED_CADDYFILE"
                  echo "# FeenQR (auto-registered $(date +%Y-%m-%d))" >> "$SHARED_CADDYFILE"
                  echo "$DOMAIN {" >> "$SHARED_CADDYFILE"
                  echo "    encode gzip" >> "$SHARED_CADDYFILE"
                  echo "    reverse_proxy feenqr-web:8080" >> "$SHARED_CADDYFILE"
                  echo "}" >> "$SHARED_CADDYFILE"
                fi
                docker exec "$SHARED_CADDY" caddy validate --config /etc/caddy/Caddyfile
                docker exec "$SHARED_CADDY" caddy reload --config /etc/caddy/Caddyfile
                echo "Caddy reloaded with FeenQR route"
              fi
            else
              echo "Shared Caddy not found — run: docker compose up -d caddy"
            fi

            echo "=== 5. Verify ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep -E 'feenqr|qdrant'
            echo "=== Done ==="
            echo "https://$DOMAIN"